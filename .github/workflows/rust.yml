name: Rust

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build
      if: hashFiles('**/*.rs') != ''
      run: cargo build --verbose
    - name: Run tests
      if: hashFiles('**/*.rs') != ''
      run: cargo test --verbose
